<!DOCTYPE html>

<html>
<head>
    <title>Candidate Registration</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background: linear-gradient(135deg,#0d6efd,#6610f2);
        min-height:100vh;
    }

    .register-card{
        max-width:600px;
        margin:auto;
        margin-top:50px;
        border-radius:15px;
    }

</style>
```

</head>

<body>

<div class="container">

```
<div class="card shadow register-card">

    <div class="card-body p-5">

        <h2 class="text-center mb-4">
            Candidate Registration
        </h2>

        <p class="text-center text-muted">
            Create your account and start applying for jobs
        </p>

        {% if message %}
        <div class="alert alert-success">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create password"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Skills
                </label>

                <textarea
                    name="skills"
                    class="form-control"
                    rows="4"
                    placeholder="Python, SQL, Django, Machine Learning"
                    required></textarea>

            </div>

            <div class="d-grid">

                <button class="btn btn-primary btn-lg">
                    Register Now
                </button>

            </div>

        </form>

        <div class="text-center mt-3">

            Already have an account?

            <a href="/login/">
                Login Here
            </a>

        </div>

    </div>

</div>
```

</div>

</body>
</html>
