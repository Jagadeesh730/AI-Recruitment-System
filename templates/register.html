{% extends 'base_public.html' %}
{% block title %}Candidate Registration{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-card-header">
            <div class="feature-icon mx-auto mb-3" style="width:48px;height:48px;font-size:22px;">
                <i class="bi bi-person-plus"></i>
            </div>
            <h2>Create an account</h2>
            <p>Start your recruitment journey</p>
        </div>
        <div class="auth-card-body">
            {% if message %}
            <div class="alert alert-success">
                <i class="bi bi-check-circle"></i> {{ message }}
                <div class="mt-2"><a href="/login/" class="btn btn-sm btn-primary">Sign In Now</a></div>
            </div>
            {% else %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Skills</label>
                    <textarea name="skills" class="form-control" rows="3" placeholder="Python, SQL, Django, Machine Learning" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-person-check"></i> Register Now
                </button>
            </form>
            <div class="auth-divider">
                <span>Already registered?</span>
            </div>
            <a href="/login/" class="btn btn-outline w-100">
                Sign In
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
