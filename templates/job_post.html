<!DOCTYPE html>
<html>
<head>
    <title>Post Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

    <a class="navbar-brand" href="/hr-dashboard/">
        AI Recruitment
    </a>

    <div class="navbar-nav">

        <a class="nav-link text-white" href="/hr-dashboard/">
            Dashboard
        </a>

        <a class="nav-link text-white" href="/post-job/">
            Post Job
        </a>

        <a class="nav-link text-white" href="/applications/">
            Applications
        </a>

        <a class="nav-link text-white" href="/ranking/">
            Rankings
        </a>

        <a class="nav-link text-white" href="/job-recommendations/">
            AI Recommendations
        </a>

        <a class="nav-link text-white" href="/schedule-interview/">
            Interviews
        </a>

        <a class="nav-link text-white" href="/logout/">
            Logout
        </a>

    </div>

</div>

</nav>


<div class="container mt-5">

    <h2>Post New Job</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Job Title</label>
            <input type="text" name="title" class="form-control">
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea name="description" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Required Skills</label>
            <textarea name="skills" class="form-control"></textarea>
        </div>

        <button class="btn btn-success">
            Post Job
        </button>

    </form>

</div>

</body>
</html>
