<!DOCTYPE html>
<html>
<head>
    <title>HR Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>HR Dashboard</h1>
    {% if top_candidate %}

<div class="alert alert-success mt-4">

    <h4>Top Candidate</h4>

    <strong>Name:</strong>
    {{ top_candidate.name }}

    <br>

    <strong>Score:</strong>
    {{ top_candidate.score }} %

    </div>

    {% endif %}

    <div class="mt-4">

        <a href="/post-job/" class="btn btn-success">
            Post Job
        </a>

        <a href="/ranking/" class="btn btn-primary">
            Candidate Ranking
        </a>
        <a href="/schedule-interview/" class="btn btn-warning">
            Schedule Interview
        </a>

        <a href="/admin/" class="btn btn-dark">
            Admin Panel
        </a>

    </div>

</div>

</body>
</html>
