<!DOCTYPE html>
<html>
<head>
    <title>Schedule Interview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Schedule Interview</h2>
    {% if message %}
    <div class="alert alert-success">
        {{ message }}
    </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Candidate Name</label>
            <input
                type="text"
                name="candidate"
                class="form-control">
        </div>

        <div class="mb-3">
            <label>Date</label>
            <input
                type="date"
                name="date"
                class="form-control">
        </div>

        <div class="mb-3">
            <label>Time</label>
            <input
                type="time"
                name="time"
                class="form-control">
        </div>

        <button class="btn btn-success">
            Schedule
        </button>

    </form>

</div>

</body>
</html>
