<!DOCTYPE html>
<html>
<head>
    <title>HR Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#212529,#0d6efd);
            min-height:100vh;
        }

        .login-card{
            max-width:500px;
            margin:auto;
            margin-top:80px;
            border-radius:15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card shadow login-card">

        <div class="card-body p-5">

            <h2 class="text-center mb-4">
                HR Login
            </h2>

            {% if message %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <button class="btn btn-primary w-100">
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
