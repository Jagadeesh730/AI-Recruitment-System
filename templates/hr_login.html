{% extends 'base_public.html' %}
{% block title %}HR Login{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-card-header">
            <div class="feature-icon mx-auto mb-3" style="width:48px;height:48px;font-size:22px;background:var(--neutral-100);color:var(--neutral-700);">
                <i class="bi bi-building"></i>
            </div>
            <h2>HR Portal</h2>
            <p>Sign in to manage recruitment</p>
        </div>
        <div class="auth-card-body">
            {% if message %}
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-circle"></i> {{ message }}
            </div>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="hr@company.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
